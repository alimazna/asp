name: ayzr_app
description: "AYZR — تطبيق ذكاء سوق الذهب XAUUSD (عرض فقط)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  fonts:
    # Arabic-first typeface (Cairo, OFL — see assets/fonts/Cairo-OFL.txt).
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
