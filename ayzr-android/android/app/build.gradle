plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.ayzr.ayzr_app"
    compileSdk = 34
    // Pin to the build-tools actually installed in this environment; the AGP
    // default (33.0.1) is not present and cannot be downloaded here.
    buildToolsVersion = "34.0.0"
    // shared_preferences_android declares NDK 27.0.12077973; Flutter's default
    // (23.1.7779620) triggers a build warning and is not installed here. Pin to
    // the highest required version — NDK releases are backward compatible.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.ayzr.ayzr_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Signed with the debug key so `flutter build apk --release` works
            // out of the box for local testing. A private distribution replaces
            // this with a real keystore (see docs/ayzr/ANDROID.md).
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
