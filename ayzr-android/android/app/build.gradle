plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// A real keystore, when supplied, lives in android/key.properties (git-ignored).
// Without it the release build falls back to the debug key so the build works
// locally; see docs/ayzr/ANDROID.md.
def keyPropsFile = rootProject.file("key.properties")
def keyProps = new Properties()
if (keyPropsFile.exists()) {
    keyProps.load(new FileInputStream(keyPropsFile))
}

android {
    namespace = "com.ayzr.ayzr_app"
    compileSdk = 34
    // Pin to the build-tools actually installed in this environment; the AGP
    // default (33.0.1) is not present and cannot be downloaded here.
    buildToolsVersion = "34.0.0"
    // shared_preferences_android declares NDK 27.0.12077973; Flutter's default
    // (23.1.7779620) triggers a build warning and is not installed here. Pin to
    // the highest required version — NDK releases are backward compatible.
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.ayzr.ayzr_app"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keyPropsFile.exists()) {
                storeFile file(keyProps["storeFile"])
                storePassword keyProps["storePassword"]
                keyAlias keyProps["keyAlias"]
                keyPassword keyProps["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // A distributable release MUST be signed with the owner's real
            // keystore, supplied as android/key.properties (git-ignored). The
            // check below fires only when a release task is actually requested,
            // so debug builds are unaffected. A release without the keystore is
            // refused rather than silently debug-signed: a debug-signed APK is
            // not a distribution artifact, and shipping one under a release
            // name would hide that. See docs/ayzr/ANDROID.md.
            def wantsRelease = gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("release")
            }
            if (keyPropsFile.exists()) {
                signingConfig = signingConfigs.release
            } else if (wantsRelease) {
                throw new GradleException(
                    "Release build needs a real signing keystore.\n" +
                    "Create android/key.properties with storeFile, " +
                    "storePassword, keyAlias and keyPassword (see " +
                    "docs/ayzr/ANDROID.md), or use `flutter build apk --debug` " +
                    "for local testing. No key is generated for you.")
            }
        }
    }
}
flutter {
    source = "../.."
}
