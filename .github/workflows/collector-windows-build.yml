name: Collector - tests and Windows build

# Standalone CI for the windows-collector app. It is independent of the ASTRA
# backend workflows: this app has no server component.

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows-collector/**'
      - '.github/workflows/collector-windows-build.yml'
  pull_request:
    paths:
      - 'windows-collector/**'
      - '.github/workflows/collector-windows-build.yml'

defaults:
  run:
    working-directory: windows-collector

jobs:
  tests:
    name: Test suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # tkinter is not needed: the window is never constructed in the tests,
      # only its pure display helpers are exercised.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  build:
    name: Build executable (Windows)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Confirm tkinter is present
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Run the test suite on Windows
        run: python -m unittest discover -s tests

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.0"

      - name: Build the executable
        run: python -m PyInstaller --clean --noconfirm packaging/astra_collector.spec

      - name: Report the artifact
        shell: pwsh
        run: |
          $exe = "dist/ASTRA-Collector.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          "Built $exe ($size MB)"
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-Collector-windows
          path: windows-collector/dist/ASTRA-Collector.exe
          if-no-files-found: error
