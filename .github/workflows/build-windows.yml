name: Build Windows .exe

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/qt/**'
      - 'src/**'
      - 'bridge/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        # Qt 6.5.x headers (qvarlengtharray.h) use 'stdext', which fails on the
        # runner's newer MSVC. Qt 6.8 is built with MSVC 2022 and is compatible.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          dir: ${{ runner.temp }}\Qt
          cache: 'true'

      # ---------------------------------------------------------------- 1/5
      - name: Configure Qt frontend
        run: cmake -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_ASTRA_DESKTOP=ON
        working-directory: frontend/qt

      - name: Build frontend Release
        run: cmake --build build --config Release --parallel
        working-directory: frontend/qt

      - name: Deploy frontend with windeployqt
        run: |
          $exe = "build/bin/Release/astra_desktop.exe"
          if (-Not (Test-Path $exe)) {
            Write-Error "Executable not found at $exe"
            Get-ChildItem -Path build -Recurse -Include "*.exe"
            exit 1
          }
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-compiler-runtime $exe
          Write-Host "windeployqt completed for $exe"
        working-directory: frontend/qt

      - name: Package portable deployment folder
        run: |
          $deployDir = "build/bin/Release"
          $zipPath = "build/ASTRA-windows.zip"
          Compress-Archive -Path "$deployDir\*" -DestinationPath $zipPath -Force
          Write-Host "Packaged to $zipPath"
          Get-Item $zipPath | Select-Object Name, Length
        working-directory: frontend/qt

      # Uploaded first so the portable artifact survives any later failure.
      - name: Upload portable artifact (ASTRA-windows)
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-windows
          path: frontend/qt/build/ASTRA-windows.zip
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------- 2/5
      - name: Configure C++ backend host
        run: cmake -B build -A x64
        working-directory: .

      - name: Build backend Release
        run: cmake --build build --config Release --target aura_backend_host --parallel
        working-directory: .

      # ---------------------------------------------------------------- 3/5
      - name: Freeze Python bridge with PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # MetaTrader5 must be present on the BUILD host so the spec's
          # collect_all('MetaTrader5') can gather its native extension and DLLs
          # into the frozen bridge. Without it the frozen exe boots but reports
          # "No module named 'MetaTrader5'" on the end user's machine.
          python -m pip install -r packaging/requirements-runtime.txt
          pyinstaller --clean --noconfirm --workpath build-pyinstaller packaging/windows/astra-bridge.spec
          if (-Not (Test-Path "dist/bridge.exe")) {
            Write-Error "bridge.exe not produced"
            exit 1
          }
          Get-Item dist/bridge.exe | Select-Object Name, Length
        working-directory: .

      - name: Verify frozen bridge bundles MetaTrader5
        # Start the frozen bridge and ask its health endpoint whether the
        # MetaTrader5 package is importable *inside the frozen bundle*. No MT5
        # terminal is required: package_available must be true even when
        # initialized is false. This is the regression guard for the frozen
        # "No module named 'MetaTrader5'" defect.
        run: |
          $bridge = "dist\bridge.exe"
          $proc = Start-Process -FilePath $bridge -ArgumentList "--port","18791" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:18791/v1/health" -TimeoutSec 3
              if ($resp.payload.package_available -eq $true) { $ok = $true; break }
            } catch { }
          }
          # Kill the whole tree: a PyInstaller one-file exe is a bootloader
          # parent plus a real child, so Stop-Process on the parent alone leaves
          # an orphaned bridge.exe that would later look like a duplicate.
          taskkill /PID $proc.Id /T /F 2>$null | Out-Null
          if (-Not $ok) {
            Write-Error "frozen bridge did not report package_available=true (MetaTrader5 missing from bundle)"
            exit 1
          }
          Write-Host "Frozen bridge reports package_available=true"
        working-directory: .

      # ---------------------------------------------------------------- 4/5
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (ASTRA-Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\astra-setup.iss
          $setup = "packaging\windows\Output\ASTRA-Setup.exe"
          if (-Not (Test-Path $setup)) {
            Write-Error "ASTRA-Setup.exe not produced"
            exit 1
          }
          Get-Item $setup | Select-Object Name, Length
        working-directory: .

      - name: Upload installer artifact (ASTRA-windows-installer)
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-windows-installer
          path: packaging/windows/Output/ASTRA-Setup.exe
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------- 5/5
      - name: Smoke test installer (silent install, launch, uninstall)
        run: |
          $setup = "packaging\windows\Output\ASTRA-Setup.exe"
          $installDir = "$env:ProgramFiles\ASTRA"
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-Not (Test-Path "$installDir\astra_desktop.exe")) {
            Write-Error "Install did not place astra_desktop.exe in $installDir"
            exit 1
          }
          if (-Not (Test-Path "$installDir\resources\bridge\mt5_python\bridge.exe")) {
            Write-Error "Install did not place the frozen bridge"
            exit 1
          }
          # Baseline process counts before the launch, so the duplicate guard
          # below measures what *this* launch spawned (robust against any stray
          # process from earlier steps).
          $baseBackend = @(Get-Process -Name "aura_backend_host" -ErrorAction SilentlyContinue).Count
          $baseBridge  = @(Get-Process -Name "bridge" -ErrorAction SilentlyContinue).Count
          Write-Host "baseline: backend=$baseBackend bridge=$baseBridge"

          $proc = Start-Process -FilePath "$installDir\astra_desktop.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Error "ASTRA exited early with code $($proc.ExitCode)"
            exit 1
          }
          # Auto-start chain (Bug 3): the frontend must spawn the backend, which
          # must spawn the bridge, without any manual step.
          $backendUp = $false
          $bridgeUp = $false
          # Sample peak process counts while the auto-start chain comes up, so a
          # transient duplicate that spawns then exits is still caught.
          $peakBackend = $baseBackend
          $peakBridge  = $baseBridge
          for ($i = 0; $i -lt 40; $i++) {
            try { Invoke-RestMethod -Uri "http://127.0.0.1:8790/api/v1/system/state" -TimeoutSec 2 | Out-Null; $backendUp = $true } catch { }
            try { Invoke-RestMethod -Uri "http://127.0.0.1:8791/v1/health" -TimeoutSec 2 | Out-Null; $bridgeUp = $true } catch { }
            $peakBackend = [Math]::Max($peakBackend, @(Get-Process -Name "aura_backend_host" -ErrorAction SilentlyContinue).Count)
            $peakBridge  = [Math]::Max($peakBridge,  @(Get-Process -Name "bridge" -ErrorAction SilentlyContinue).Count)
            if ($backendUp -and $bridgeUp) { break }
            Start-Sleep -Milliseconds 500
          }
          $logPath = "$installDir\logs\frontend-autostart.log"
          if (Test-Path $logPath) { Get-Content $logPath }

          # Bug 2 regression guard: this launch must spawn exactly one backend
          # and at most one bridge (PyInstaller one-file = parent + child, so up
          # to 2 bridge.exe processes). Measured as a delta from the baseline.
          $backendCount = @(Get-Process -Name "aura_backend_host" -ErrorAction SilentlyContinue).Count
          $bridgeCount  = @(Get-Process -Name "bridge" -ErrorAction SilentlyContinue).Count
          $spawnedBackend = $backendCount - $baseBackend
          $spawnedBridge  = $bridgeCount - $baseBridge
          Write-Host "final: backend=$backendCount bridge=$bridgeCount; spawned: backend=$spawnedBackend bridge=$spawnedBridge; peak: backend=$peakBackend bridge=$peakBridge"
          tasklist | findstr /I "aura_backend_host bridge"
          if ($spawnedBackend -ne 1) {
            Write-Error "expected the launch to spawn exactly 1 aura_backend_host.exe, spawned $spawnedBackend"
            exit 1
          }
          if ($spawnedBridge -lt 1 -or $spawnedBridge -gt 2) {
            Write-Error "expected the launch to spawn 1-2 bridge.exe (PyInstaller parent+child), spawned $spawnedBridge"
            exit 1
          }
          if ($peakBackend -gt ($baseBackend + 1)) {
            Write-Error "observed duplicate backend processes during startup: peak $peakBackend"
            exit 1
          }
          if ($peakBridge -gt ($baseBridge + 2)) {
            Write-Error "observed duplicate bridge processes during startup: peak $peakBridge"
            exit 1
          }

          Stop-Process -Id $proc.Id -Force
          if (-Not $backendUp) {
            Get-ChildItem "$installDir\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName }
            Write-Error "backend did not come up automatically after launching ASTRA"
            exit 1
          }
          if (-Not $bridgeUp) {
            Write-Error "bridge did not come up automatically behind the backend"
            exit 1
          }
          Write-Host "ASTRA auto-started backend (8790) and bridge (8791)"
          $un = "$installDir\unins000.exe"
          if (Test-Path $un) {
            Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
            Write-Host "Uninstalled cleanly"
          }
        working-directory: .
