name: Build Windows .exe

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/qt/**'
      - 'src/**'
      - 'bridge/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8
        # Qt 6.5.x headers (qvarlengtharray.h) use 'stdext', which fails on the
        # runner's newer MSVC. Qt 6.8 is built with MSVC 2022 and is compatible.
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          dir: ${{ runner.temp }}\Qt
          cache: 'true'

      # ---------------------------------------------------------------- 1/5
      - name: Configure Qt frontend
        run: cmake -B build -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DBUILD_ASTRA_DESKTOP=ON -DBUILD_ASTRA_TESTS=ON
        working-directory: frontend/qt

      - name: Build frontend Release
        run: cmake --build build --config Release --parallel
        working-directory: frontend/qt

      - name: Run offscreen frontend tests (incl. auto-start retry)
        # These run BEFORE deployment. They are pure/offscreen (mock loopback
        # server, no external services) and include astra_health_retry_tests which
        # pins the fix for the "declared OFFLINE on the first probe" bug.
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          ctest --test-dir build -C Release --output-on-failure
        working-directory: frontend/qt

      - name: Deploy frontend with windeployqt
        run: |
          $exe = "build/bin/Release/astra_desktop.exe"
          if (-Not (Test-Path $exe)) {
            Write-Error "Executable not found at $exe"
            Get-ChildItem -Path build -Recurse -Include "*.exe"
            exit 1
          }
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-compiler-runtime $exe
          Write-Host "windeployqt completed for $exe"
        working-directory: frontend/qt

      - name: Package portable deployment folder
        run: |
          $deployDir = "build/bin/Release"
          $zipPath = "build/ASTRA-windows.zip"
          Compress-Archive -Path "$deployDir\*" -DestinationPath $zipPath -Force
          Write-Host "Packaged to $zipPath"
          Get-Item $zipPath | Select-Object Name, Length
        working-directory: frontend/qt

      # Uploaded first so the portable artifact survives any later failure.
      - name: Upload portable artifact (ASTRA-windows)
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-windows
          path: frontend/qt/build/ASTRA-windows.zip
          retention-days: 30
          if-no-files-found: error

      # ---------------------------------------------------------------- 2/5
      - name: Configure C++ backend host
        run: cmake -B build -A x64
        working-directory: .

      - name: Build backend Release
        run: cmake --build build --config Release --target aura_backend_host --parallel
        working-directory: .

      - name: Run backend tests (incl. candle staleness + loopback concurrency)
        # These exercise the two backend defects behind the reported field
        # failure: (1) CandlesApiTests::real_bridge_allow_stale_* drives the REAL
        # bundled Python bridge with a stale fake-MT5 feed and asserts that a
        # strict fetch is refused (MARKET_DATA_STALE) while allow_stale returns
        # the last real bars — the "chart never renders" bug; (2)
        # LoopbackConcurrencyTests drives the REAL LoopbackApiServer with a slow
        # bridge proxy and asserts /health is not blocked behind a slow /candles
        # — the "ui health ok / offline" flip-flop. Both boot a real Python
        # bridge and are Linux/Windows-portable (Python is on the runner PATH).
        run: |
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
        working-directory: .

      # ---------------------------------------------------------------- 3/5
      - name: Freeze Python bridge with PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # MetaTrader5 must be present on the BUILD host so the spec's
          # collect_all('MetaTrader5') can gather its native extension and DLLs
          # into the frozen bridge. Without it the frozen exe boots but reports
          # "No module named 'MetaTrader5'" on the end user's machine.
          python -m pip install -r packaging/requirements-runtime.txt
          pyinstaller --clean --noconfirm --workpath build-pyinstaller packaging/windows/astra-bridge.spec
          if (-Not (Test-Path "dist/bridge.exe")) {
            Write-Error "bridge.exe not produced"
            exit 1
          }
          Get-Item dist/bridge.exe | Select-Object Name, Length
        working-directory: .

      - name: Verify frozen bridge bundles MetaTrader5
        # Start the frozen bridge and ask its health endpoint whether the
        # MetaTrader5 package is importable *inside the frozen bundle*. No MT5
        # terminal is required: package_available must be true even when
        # initialized is false. This is the regression guard for the frozen
        # "No module named 'MetaTrader5'" defect.
        run: |
          $bridge = "dist\bridge.exe"
          $proc = Start-Process -FilePath $bridge -ArgumentList "--port","18791" -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 20; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $resp = Invoke-RestMethod -Uri "http://127.0.0.1:18791/v1/health" -TimeoutSec 3
              if ($resp.payload.package_available -eq $true) { $ok = $true; break }
            } catch { }
          }
          # Kill the whole tree: a PyInstaller one-file exe is a bootloader
          # parent plus a real child, so Stop-Process on the parent alone leaves
          # an orphaned bridge.exe that would later look like a duplicate.
          taskkill /PID $proc.Id /T /F 2>$null | Out-Null
          if (-Not $ok) {
            Write-Error "frozen bridge did not report package_available=true (MetaTrader5 missing from bundle)"
            exit 1
          }
          Write-Host "Frozen bridge reports package_available=true"
        working-directory: .

      # ---------------------------------------------------------------- 4/5
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer (ASTRA-Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\astra-setup.iss
          $setup = "packaging\windows\Output\ASTRA-Setup.exe"
          if (-Not (Test-Path $setup)) {
            Write-Error "ASTRA-Setup.exe not produced"
            exit 1
          }
          Get-Item $setup | Select-Object Name, Length
        working-directory: .

      - name: Upload installer artifact (ASTRA-windows-installer)
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-windows-installer
          path: packaging/windows/Output/ASTRA-Setup.exe
          retention-days: 30
          if-no-files-found: error


      # ---------------------------------------------------------------- 5/5
      # Reproduces the EXACT real user flow: silent install into the default
      # Program Files location, then launch the *installed* astra_desktop.exe via
      # the Start-Menu shortcut target, and assert the auto-start chain came up.
      #
      # The previous version of this test launched astra_desktop.exe but counted
      # backend/bridge processes without ever exercising the non-elevated path:
      # the runner is elevated, so the writable-state assumption (logs/locks under
      # the install dir) happened to hold and the test stayed green while a real
      # non-elevated launch failed silently. This version asserts ports + log
      # location too, and a companion step below removes the elevation so the
      # writable-state path is exercised honestly.
      - name: Smoke test installer (silent install, launch from installed folder, uninstall)
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "packaging\windows\Output\ASTRA-Setup.exe"
          $installDir = "$env:ProgramFiles\ASTRA"
          $userRoot = "$env:LOCALAPPDATA\ASTRA"
          $autostartLog = "$userRoot\logs\frontend-autostart.log"
          $backendHostLog = "$userRoot\logs\backend-host.log"

          # Start from a clean slate so a leftover process cannot mask a failure.
          foreach ($n in @("astra_desktop","aura_backend_host","bridge")) {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Remove-Item $autostartLog -Force -ErrorAction SilentlyContinue
          Remove-Item $backendHostLog -Force -ErrorAction SilentlyContinue

          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-Not (Test-Path "$installDir\astra_desktop.exe")) {
            Write-Error "Install did not place astra_desktop.exe in $installDir"; exit 1
          }
          if (-Not (Test-Path "$installDir\aura_backend_host.exe")) {
            Write-Error "Install did not place aura_backend_host.exe"; exit 1
          }
          if (-Not (Test-Path "$installDir\resources\bridge\mt5_python\bridge.exe")) {
            Write-Error "Install did not place the frozen bridge"; exit 1
          }

          # Launch the installed app exactly as the Start-Menu shortcut does.
          $launchClock = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath "$installDir\astra_desktop.exe" -PassThru
          if ($proc.HasExited) {
            Write-Error "astra_desktop.exe exited immediately (code $($proc.ExitCode))"; exit 1
          }

          # Fail if the frontend declared the backend unreachable *without ever
          # spawning it*. That is the missing-executable/refused-spawn case where
          # no backend can ever appear. A backend that IS spawned may legitimately
          # show the failure banner mid-way through a long cold start (see the 90s
          # recovery poll below), so that banner alone is not asserted against here.
          function Assert-NoPrematureOffline([string]$label) {
            if (Test-Path $autostartLog) {
              $lines = @(Get-Content $autostartLog)
              if ($lines -match "FAILED: backend host not found") {
                Write-Error "[$label] auto-start log recorded the backend was never spawned:"
                $lines | Write-Host; exit 1
              }
            }
          }

          # ---- Acceptance gate: the EXACT five conditions a real user checks,
          # all within a 10s window. These are what a green CI must prove, and
          # they are asserted as one block so the failure names the unmet
          # condition rather than a downstream symptom.
          #   (2) exactly one aura_backend_host.exe AND >=1 bridge.exe
          #   (3) /api/v1/health answers with a valid, non-OFFLINE envelope
          #   (4) /v1/health answers status=OK, process_state=ONLINE
          #   (5) the auto-start log exists with the attempt + its outcome
          $backendProc = 0; $bridgeProc = 0; $backendHealth = $false; $bridgeHealth = $false
          $sawStarting = $false; $sawAggregate = ""
          $deadline = (Get-Date).AddSeconds(10)
          while ((Get-Date) -lt $deadline) {
            $backendProc = @(Get-Process -Name "aura_backend_host" -ErrorAction SilentlyContinue).Count
            $bridgeProc  = @(Get-Process -Name "bridge" -ErrorAction SilentlyContinue).Count
            try {
              $hh = Invoke-RestMethod -Uri "http://127.0.0.1:8790/api/v1/health" -TimeoutSec 2
              if ($hh.api -eq "v1" -and $hh.data.aggregate) {
                $backendHealth = $true
                $sawAggregate = $hh.data.aggregate
                if ($hh.data.aggregate -eq "STARTING") { $sawStarting = $true }
              }
            } catch { }
            try {
              $bh = Invoke-RestMethod -Uri "http://127.0.0.1:8791/v1/health" -TimeoutSec 2
              if ($bh.status -eq "OK" -and $bh.payload.process_state -eq "ONLINE") { $bridgeHealth = $true }
            } catch { }
            if ($backendProc -eq 1 -and $bridgeProc -ge 1 -and $backendHealth -and $bridgeHealth) { break }
            Start-Sleep -Milliseconds 250
          }
          Write-Host "t+10s gate: backendProc=$backendProc bridgeProc=$bridgeProc backendHealth=$backendHealth($sawAggregate) bridgeHealth=$bridgeHealth"
          Assert-NoPrematureOffline "t+10s"
          if ($backendProc -ne 1) { Write-Error "within 10s: expected exactly 1 aura_backend_host.exe, found $backendProc"; exit 1 }
          if ($bridgeProc -lt 1)  { Write-Error "within 10s: expected at least 1 bridge.exe, found $bridgeProc"; exit 1 }
          if (-Not $backendHealth) { Write-Error "within 10s: /api/v1/health did not answer with a valid envelope"; exit 1 }
          if ($sawAggregate -eq "OFFLINE") { Write-Error "within 10s: /api/v1/health reported aggregate=OFFLINE (must be DEGRADED/STARTING)"; exit 1 }
          if (-Not $bridgeHealth) { Write-Error "within 10s: /v1/health did not report status=OK process_state=ONLINE"; exit 1 }
          # Early-bind property (this fix): the API must answer STARTING while the
          # bridge is still handshaking. If the backend blocked its bind on the
          # handshake, the first observable aggregate would already be DEGRADED.
          # A fully-warm fast start may legitimately skip STARTING, so this is
          # informational, not fatal.
          if ($sawStarting) { Write-Host "early-bind confirmed: /health answered aggregate=STARTING before the handshake completed" }

          # ---- Early-bind ORDERING proof from the installed binary's own timeline
          # log. The acceptance gate above cannot see the difference between "the
          # API bound early" and "the bridge happened to start fast": on a warm
          # runner both look identical. The reported field failure was port 8790
          # silent for ~173s while the bridge was spawned, i.e. the bind ran after
          # the spawn. The host now logs a millisecond timeline; assert the bind
          # line precedes the spawn line. This is the deterministic regression
          # guard for the real defect, independent of how fast the bridge is here.
          if (-Not (Test-Path $backendHostLog)) {
            Write-Error "no backend host log at $backendHostLog (cannot verify the bind-before-spawn ordering)"; exit 1
          }
          $hostLines = @(Get-Content $backendHostLog)
          $bindLine = $hostLines | Where-Object { $_ -match "frontend api bound" } | Select-Object -First 1
          $spawnLine = $hostLines | Where-Object { $_ -match "startAsync \(bridge spawn\)" } | Select-Object -First 1
          if (-Not $bindLine) { Write-Error "backend host log has no 'frontend api bound' line"; $hostLines | Write-Host; exit 1 }
          if (-Not $spawnLine) { Write-Error "backend host log has no 'startAsync (bridge spawn)' line"; $hostLines | Write-Host; exit 1 }
          $bindMs = [int]([regex]::Match($bindLine, "t\+(\d+)ms").Groups[1].Value)
          $spawnMs = [int]([regex]::Match($spawnLine, "t\+(\d+)ms").Groups[1].Value)
          Write-Host "backend timeline: bind=$bindMs ms, spawn=$spawnMs ms"
          if ($bindMs -gt $spawnMs) {
            Write-Error "the API bound ($bindMs ms) AFTER the bridge spawn ($spawnMs ms): the frontend would be left OFFLINE for the whole spawn. Early-bind regression."
            $hostLines | Write-Host; exit 1
          }
          Write-Host "early-bind ordering confirmed: API bound at $bindMs ms, before the bridge spawn at $spawnMs ms"

          # ---- Recovery window: a cold start (bridge handshake → MT5) can take
          # longer than 10s, so the Qt window may legitimately show its banner
          # mid-way; it MUST recover and log "ui health ok: aggregate=...". The
          # old test gave up at ~10s and could not see a late recovery.
          $uiUp = $false
          for ($i = 0; $i -lt 18; $i++) {
            if (Test-Path $autostartLog) {
              if (@(Get-Content $autostartLog) -match "ui health ok: aggregate=") { $uiUp = $true; break }
            }
            Start-Sleep -Seconds 5
          }
          if (-Not $uiUp) { Write-Error "the Qt window never logged 'ui health ok: aggregate=...' within 90s (stuck OFFLINE)"; exit 1 }
          $g = @(Get-Process -Name "bridge" -ErrorAction SilentlyContinue).Count
          Write-Host "post-health counts: bridge=$g"
          if ($g -lt 1) { Write-Error "expected at least 1 bridge.exe after the health wait, found $g"; exit 1 }

          # ---- UI stability: once the window first goes live, it must NOT flip
          # back to OFFLINE within 30s. The field bug was the UI alternating
          # "ui health ok"/"ui health offline" every ~10s on a healthy backend,
          # so the chart never had a stable window to fetch candles. Poll the log
          # every 5s for 30s and fail if an "ui health offline" follows the first
          # "ui health ok".
          for ($i = 0; $i -lt 6; $i++) {
            Start-Sleep -Seconds 5
            $cur = @(Get-Content $autostartLog)
            $firstOk = -1
            for ($j = 0; $j -lt $cur.Count; $j++) { if ($cur[$j] -match "ui health ok") { $firstOk = $j; break } }
            if ($firstOk -ge 0 -and $firstOk -lt ($cur.Count - 1)) {
              $after = @($cur[($firstOk + 1)..($cur.Count - 1)] | Where-Object { $_ -match "ui health offline" })
              if ($after.Count -gt 0) {
                Write-Error "UI flip-flop: 'ui health offline' appeared after 'ui health ok' on a healthy backend"
                $cur | Write-Host; exit 1
              }
            }
          }
          Write-Host "UI stability: no offline flip after the first health ok (30s)"

          Write-Host "---- process state ----"
          tasklist | findstr /I "astra_desktop aura_backend_host bridge"
          Write-Host "---- frontend-autostart.log ($autostartLog) ----"
          if (Test-Path $autostartLog) { Get-Content $autostartLog } else { Write-Host "(missing)" }
          Write-Host "---- %LOCALAPPDATA%\ASTRA\logs\backend-host.log ----"
          $backendLog = "$env:LOCALAPPDATA\ASTRA\logs\backend-host.log"
          if (Test-Path $backendLog) { Get-Content $backendLog } else { Write-Host "(missing)" }

          $desktopCount = @(Get-Process -Name "astra_desktop" -ErrorAction SilentlyContinue).Count
          $backendCount = @(Get-Process -Name "aura_backend_host" -ErrorAction SilentlyContinue).Count
          $bridgeCount  = @(Get-Process -Name "bridge" -ErrorAction SilentlyContinue).Count
          Write-Host "final counts: desktop=$desktopCount backend=$backendCount bridge=$bridgeCount"
          if ($desktopCount -ne 1) { Write-Error "expected exactly 1 astra_desktop.exe, found $desktopCount"; exit 1 }
          if ($backendCount -ne 1) { Write-Error "expected exactly 1 aura_backend_host.exe, found $backendCount"; exit 1 }
          if ($bridgeCount -lt 1) { Write-Error "expected at least 1 bridge.exe, found $bridgeCount"; exit 1 }

          if (-Not (Test-Path $autostartLog)) {
            Write-Error "no auto-start log at $autostartLog (user-writable location)"
            exit 1
          }
          $logLines = @(Get-Content $autostartLog)
          if ($logLines.Count -lt 1) { Write-Error "auto-start log is empty: $autostartLog"; exit 1 }
          if (-Not ($logLines -match "spawn ok")) {
            Write-Error "auto-start log has no successful spawn line:"; $logLines | Write-Host; exit 1
          }
          # Retry/recovery evidence: the frontend logged that it reached the
          # backend rather than declaring OFFLINE. Either the ordinary
          # "backend reachable after Ns" or the long-cold-start
          # "ui recovered: backend reachable after Ns (long-start)" satisfies it.
          if (-Not ($logLines -match "backend reachable after")) {
            Write-Error "auto-start log has no 'backend reachable after' line (retry/recovery not exercised):"
            $logLines | Write-Host; exit 1
          }
          # If the failure banner was ever shown, a later recovery line MUST follow:
          # a banner that never clears is the stuck-OFFLINE bug.
          if (($logLines -match "ui banner: backend not reachable") -and
              -Not ($logLines -match "ui recovered: backend reachable")) {
            Write-Error "the failure banner was shown but no late recovery was logged (banner stuck):"
            $logLines | Write-Host; exit 1
          }
          # UI-liveness evidence. The field bug was the Qt window painting
          # OFFLINE while /health answered; the port/process checks above cannot
          # see that. onHealthUpdated() writes "ui health ok: aggregate=..." when
          # the window considers itself live. Its absence means the window never
          # went live, and a trailing "ui health offline" means the window ended
          # OFFLINE despite the API being up — both are the reported failure.
          if (-Not ($logLines -match "ui health ok")) {
            Write-Error "auto-start log has no 'ui health ok' line: the Qt window never considered the backend live while /health answered"
            $logLines | Write-Host; exit 1
          }
          $liveness = @($logLines | Where-Object { $_ -match "ui health (ok|offline)" })
          if ($liveness.Count -gt 0 -and $liveness[-1] -match "ui health offline") {
            Write-Error "the Qt window ended on 'ui health offline' although /health is reachable — UI false-OFFLINE regression"
            $liveness | Write-Host; exit 1
          }
          # Duplicate-spawn guard evidence: exactly one spawn ATTEMPT and one
          # success. The field log showed two "attempting to spawn" lines 33s
          # apart; both counts must be exactly 1.
          $spawnAttemptCount = @($logLines | Where-Object { $_ -match "attempting to spawn" }).Count
          if ($spawnAttemptCount -ne 1) {
            Write-Error "expected exactly 1 'attempting to spawn' line, found $spawnAttemptCount (duplicate-spawn regression)"
            $logLines | Write-Host; exit 1
          }
          $spawnOkCount = @($logLines | Where-Object { $_ -match "spawn ok" }).Count
          if ($spawnOkCount -ne 1) { Write-Error "expected exactly 1 'spawn ok' line, found $spawnOkCount"; exit 1 }

          # Chart-data evidence: the chart must actually have fetched candles
          # from the backend (the frontend records this, since the backend keeps
          # no request log). The chart's FIRST fetch fires during the backend's
          # bake-in and can legitimately fail at the transport layer before the
          # backend binds, so a transient early network error is allowed — but
          # the fetch must eventually succeed, and the LAST recorded candle line
          # must not be a transport failure (that would mean the chart never
          # rendered: exactly the reported bug).
          if (-Not ($logLines -match "ui candles:")) {
            Write-Error "auto-start log has no 'ui candles:' line: the chart never fetched /api/v1/candles"
            $logLines | Write-Host; exit 1
          }
          $candleLines = @($logLines | Where-Object { $_ -match "ui candles:" })
          $lastCandleLine = $candleLines[-1]
          Write-Host "chart candle lines: $($candleLines.Count); last: $lastCandleLine"
          if ($lastCandleLine -match "fetch failed \(network_error") {
            Write-Error "chart candle fetch ended in a transport failure (the chart cannot render): $lastCandleLine"
            $logLines | Write-Host; exit 1
          }
          # A structured 'dependency_unavailable' is honest: on this runner there
          # is no live MT5 terminal, so the bridge answers 503 rather than
          # fabricating bars. That is a data-absence, not a UI bug. When the
          # backend does return bars, require them to be usable.
          if (($lastCandleLine -notmatch "fetch failed") -and
              (-Not ($lastCandleLine -match "ui candles: tf=.* available=true"))) {
            Write-Error "chart candle fetch returned no usable data: $lastCandleLine"
            $logLines | Write-Host; exit 1
          }
          Write-Host "chart fetch evidence: $lastCandleLine"
          Write-Host "smoke elapsed: $($launchClock.Elapsed.TotalSeconds.ToString('0.0'))s"

          # Clean shutdown, then uninstall, so no process is left holding the ports.
          foreach ($n in @("astra_desktop","aura_backend_host","bridge")) {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          $un = "$installDir\unins000.exe"
          if (Test-Path $un) {
            Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
            Write-Host "Uninstalled cleanly"
          }

          # ---- Reinstall once more and relaunch: no orphans, no duplicates. A
          # fresh install must not leave the previous run's host/bridge alive, and
          # a second launch must spawn exactly one of each (the duplicate-host
          # regression the single-instance lock guards).
          Start-Sleep -Seconds 3
          foreach ($n in @("astra_desktop","aura_backend_host","bridge")) {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          $autostartLog2 = "$userRoot\logs\frontend-autostart.log"
          Remove-Item $autostartLog2 -Force -ErrorAction SilentlyContinue

          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          if (-Not (Test-Path "$installDir\astra_desktop.exe")) {
            Write-Error "reinstall did not place astra_desktop.exe"; exit 1
          }
          Start-Process -FilePath "$installDir\astra_desktop.exe" -PassThru | Out-Null
          $backendUp2 = $false; $bridgeUp2 = $false; $uiUp2 = $false
          for ($i = 0; $i -lt 18; $i++) {
            Start-Sleep -Seconds 5
            try { Invoke-RestMethod -Uri "http://127.0.0.1:8790/api/v1/health" -TimeoutSec 2 | Out-Null; $backendUp2 = $true } catch { }
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8791/v1/health" -TimeoutSec 2
              if ($h.status -eq "OK" -and $h.payload.process_state -eq "ONLINE") { $bridgeUp2 = $true }
            } catch { }
            if (Test-Path $autostartLog2) {
              if (@(Get-Content $autostartLog2) -match "ui health ok: aggregate=") { $uiUp2 = $true }
            }
            if ($backendUp2 -and $bridgeUp2 -and $uiUp2) { break }
          }
          if (-Not $backendUp2 -or -Not $bridgeUp2 -or -Not $uiUp2) {
            Write-Error "relaunch after reinstall: chain did not come up cleanly (backend=$backendUp2 bridge=$bridgeUp2 ui=$uiUp2)"; exit 1
          }
          $d2 = @(Get-Process -Name "astra_desktop" -ErrorAction SilentlyContinue).Count
          $b2 = @(Get-Process -Name "aura_backend_host" -ErrorAction SilentlyContinue).Count
          $g2 = @(Get-Process -Name "bridge" -ErrorAction SilentlyContinue).Count
          Write-Host "reinstall counts: desktop=$d2 backend=$b2 bridge=$g2"
          if ($d2 -ne 1) { Write-Error "reinstall: expected exactly 1 astra_desktop.exe, found $d2"; exit 1 }
          if ($b2 -ne 1) { Write-Error "reinstall: expected exactly 1 aura_backend_host.exe (orphan/duplicate), found $b2"; exit 1 }
          if ($g2 -lt 1) { Write-Error "reinstall: expected at least 1 bridge.exe, found $g2"; exit 1 }
          if (Test-Path $autostartLog2) {
            $spawn2 = @((Get-Content $autostartLog2) | Where-Object { $_ -match "spawn ok" }).Count
            if ($spawn2 -ne 1) { Write-Error "reinstall: expected exactly 1 'spawn ok' line, found $spawn2"; exit 1 }
          }
          foreach ($n in @("astra_desktop","aura_backend_host","bridge")) {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          if (Test-Path $un) {
            Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          }
          Write-Host "ASTRA auto-start smoke test PASSED (installed flow, reinstall clean)"
        working-directory: .

      # ---------------------------------------------------------------- 6/6
      # Root-cause regression for the reported field failure. The smoke test above
      # runs on an ELEVATED runner, where writing under C:\Program Files happens
      # to succeed; the human's normal (non-elevated) Start-Menu launch failed
      # because the backend's writable state (logs/locks) was resolved under the
      # install dir. This step proves the fix by (a) breaking the NEW writable
      # location and asserting the frontend still surfaces a legible error, and
      # (b) restoring it and asserting the chain comes up in the user-writable
      # location.
      - name: Regression — backend writable-state location (non-elevated path)
        run: |
          $ErrorActionPreference = "Stop"
          $setup = "packaging\windows\Output\ASTRA-Setup.exe"
          $installDir = "$env:ProgramFiles\ASTRA"
          $userRoot = "$env:LOCALAPPDATA\ASTRA"
          $autostartLog = "$userRoot\logs\frontend-autostart.log"

          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          Remove-Item $autostartLog -Force -ErrorAction SilentlyContinue

          # (a) Break the user-writable root: replace it with a FILE so no process
          # can create <userRoot>\logs. This is the non-elevated failure mode.
          Remove-Item $userRoot -Recurse -Force -ErrorAction SilentlyContinue
          Set-Content -Path $userRoot -Value "blocked" -Force
          $proc = Start-Process -FilePath "$installDir\astra_desktop.exe" -PassThru
          Start-Sleep -Seconds 12
          $backendUp = $false
          try { Invoke-RestMethod -Uri "http://127.0.0.1:8790/api/v1/health" -TimeoutSec 2 | Out-Null; $backendUp = $true } catch { }
          if ($backendUp) { Write-Error "backend unexpectedly started while its writable root was unwritable"; exit 1 }
          if (Test-Path "$installDir\backend-startup.failed") {
            Write-Host "backend staged failure marker:"; Get-Content "$installDir\backend-startup.failed"
          } else {
            Write-Host "(no staged marker — acceptable; failure is still observable via OFFLINE + log)"
          }
          foreach ($n in @("astra_desktop","aura_backend_host","bridge")) {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          Remove-Item $userRoot -Recurse -Force -ErrorAction SilentlyContinue

          # (b) Restore the writable root and confirm the chain comes up again.
          foreach ($n in @("astra_desktop","aura_backend_host","bridge")) {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Remove-Item $autostartLog -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath "$installDir\astra_desktop.exe" -PassThru
          $backendUp = $false; $bridgeUp = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try { Invoke-RestMethod -Uri "http://127.0.0.1:8790/api/v1/health" -TimeoutSec 2 | Out-Null; $backendUp = $true } catch { }
            try {
              $h = Invoke-RestMethod -Uri "http://127.0.0.1:8791/v1/health" -TimeoutSec 2
              if ($h.status -eq "OK" -and $h.payload.process_state -eq "ONLINE") { $bridgeUp = $true }
            } catch { }
            if ($backendUp -and $bridgeUp) { break }
          }
          if (-Not $backendUp -or -Not $bridgeUp) {
            Write-Error "chain did not come up with a writable user root (backend=$backendUp bridge=$bridgeUp)"
            exit 1
          }
          if (-Not (Test-Path $autostartLog)) {
            Write-Error "auto-start log not written to the user-writable location $autostartLog"; exit 1
          }
          Write-Host "Regression PASSED: chain uses the user-writable root and logs there"

          foreach ($n in @("astra_desktop","aura_backend_host","bridge")) {
            Get-Process -Name $n -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          $un = "$installDir\unins000.exe"
          if (Test-Path $un) { Start-Process -FilePath $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait }
        working-directory: .
