name: Build Windows Astra Sender

on:
  workflow_dispatch:
  push:
    tags:
      - "sender-*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Verify sender unit tests on Windows
        working-directory: windows-sender
        shell: bash
        run: |
          python -m unittest discover -s tests -v

      - name: Build single-file executable
        working-directory: windows-sender
        run: |
          python -m PyInstaller --clean --noconfirm astra_sender.spec

      - name: Smoke-run the frozen app (headless)
        working-directory: windows-sender
        run: |
          if (Test-Path .\dist\AstraSender.exe) {
            Write-Host "AstraSender.exe present: $((Get-Item .\dist\AstraSender.exe).Length) bytes"
          } else {
            Write-Error "AstraSender.exe was not built"
            exit 1
          }
          # --console with no config exits with code 2 and an actionable message.
          $env:ASTRA_CONFIG_SMOKE = "1"
          & .\dist\AstraSender.exe --console 2>&1 | Out-String | Write-Host
          if ($LASTEXITCODE -eq 2) {
            Write-Host "Frozen app exits correctly when unconfigured (code 2)"
            exit 0
          }
          Write-Host "Frozen app exited with code $LASTEXITCODE"
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraSender-exe
          path: windows-sender/dist/AstraSender.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/sender-')
        uses: softprops/action-gh-release@v2
        with:
          files: windows-sender/dist/AstraSender.exe
          fail_on_unmatched_files: true