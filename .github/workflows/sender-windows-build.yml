name: Build Windows Astra Sender

on:
  workflow_dispatch:
    inputs:
      sender_token:
        description: "Optional. When set, builds a single self-contained installer with this token embedded. Never logged."
        required: false
        default: ""
      embed:
        description: "Set to 1 with sender_token to produce the self-contained installer."
        required: false
        default: "0"
  push:
    tags:
      - "sender-*"

permissions:
  contents: write   # allow attaching the .exe to a GitHub Release on tag push

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # Bundle the Windows-only MT5 package so the frozen app reads the
          # local terminal with no extra setup on the owner's PC.
          python -m pip install MetaTrader5

      - name: Verify sender unit tests on Windows
        working-directory: windows-sender
        shell: bash
        run: |
          python -m unittest discover -s tests -v

      - name: Build single-file executable
        working-directory: windows-sender
        run: |
          python -m PyInstaller --clean --noconfirm astra_sender.spec

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer (elevating, machine-wide)
        working-directory: windows-sender
        shell: pwsh
        env:
          ASTRA_SENDER_TOKEN: ${{ secrets.ASTRA_SENDER_TOKEN }}
          INPUT_TOKEN: ${{ github.event.inputs.sender_token }}
          INPUT_EMBED: ${{ github.event.inputs.embed }}
        run: |
          # Resolve the token: prefer the explicit dispatch input, else a repo
          # secret if one exists. Keep it in an env var and write only to a
          # file; never echo it. `Remove-Item Env:` narrows its lifetime.
          $tok = $env:INPUT_TOKEN
          if (-not $tok) { $tok = $env:ASTRA_SENDER_TOKEN }
          $embed = ($env:INPUT_EMBED -eq "1")

          @{
            backend_url = "https://astra-server-production.up.railway.app"
            sender_token = $tok
            sender_id = "win10-desk-01"
            symbol = "XAUUSD"
            timeframes = @("M1","M5","M15","M30","H1","H4","D1","W1","MN1")
            poll_interval_seconds = 30
            catchup_max_bars = 200
            request_timeout_seconds = 30
          } | ConvertTo-Json | Set-Content -Encoding utf8 .\installer\config.json
          Remove-Item Env:INPUT_TOKEN, Env:ASTRA_SENDER_TOKEN -ErrorAction SilentlyContinue

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $args = @()
          if ($tok -and $embed) {
            Write-Host "single installer: embedding config (token hidden)"
            $args += "/DEmbedConfig=1"
            $args += '/FAstraSenderSetup-0.4.2-Configured'
          } else {
            Write-Host "generic installer (config read from beside the setup)"
          }
          & $iscc @args ".\installer\astra_sender.iss"
          Remove-Item .\installer\config.json -Force -ErrorAction SilentlyContinue
          Get-ChildItem .\installer\dist -Filter *.exe | ForEach-Object {
            Write-Host "installer: $($_.Name) $($_.Length) bytes"
          }

      - name: Smoke-run the frozen app (headless)
        working-directory: windows-sender
        env:
          # A frozen windowed exe shows a native message box on setup errors,
          # which blocks forever with no user to click it. --version and
          # --selfcheck return before that path, but disable it regardless so a
          # future change cannot hang CI.
          ASTRA_SENDER_NO_DIALOG: "1"
        run: |
          if (Test-Path .\dist\AstraSender.exe) {
            Write-Host "AstraSender.exe present: $((Get-Item .\dist\AstraSender.exe).Length) bytes"
          } else {
            Write-Error "AstraSender.exe was not built"
            exit 1
          }
          # Windowed-subsystem exes do not set $LASTEXITCODE; use
          # Start-Process -PassThru -Wait to read the real exit code.
          $p = Start-Process -FilePath ".\dist\AstraSender.exe" `
                              -ArgumentList "--version" -PassThru -Wait
          $code = $p.ExitCode
          Write-Host "Frozen app --version exit code: $code"
          if ($code -ne 0) {
            Write-Error "Frozen app --version exited with $code"
            exit 1
          }
          Write-Host "Frozen app --version passed (exit 0)"

          # --version returns before the relative imports, so it cannot catch
          # the relative-import crash that shipped in sender-v0.3.0.
          # --selfcheck imports every runtime module and must exit 0.
          $s = Start-Process -FilePath ".\dist\AstraSender.exe" `
                              -ArgumentList "--selfcheck" -PassThru -Wait
          $scode = $s.ExitCode
          Write-Host "Frozen app --selfcheck exit code: $scode"
          if ($scode -ne 0) {
            Write-Error "Frozen app --selfcheck exited with $scode"
            exit 1
          }
          Write-Host "Frozen app --selfcheck passed (exit 0)"

          # The windowed exe has no stdout; it writes selfcheck.txt in cwd.
          if (Test-Path .\selfcheck.txt) {
            Get-Content .\selfcheck.txt | Write-Host
            if (-not (Select-String -Path .\selfcheck.txt -Pattern "MetaTrader5: bundled" -Quiet)) {
              Write-Error "MetaTrader5 is not bundled in the exe"
              exit 1
            }
          } else {
            Write-Error "selfcheck.txt not produced"
            exit 1
          }
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstraSender-exe
          path: |
            windows-sender/dist/AstraSender.exe
            windows-sender/installer/dist/AstraSenderSetup-*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/sender-')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-sender/dist/AstraSender.exe
            windows-sender/installer/dist/AstraSenderSetup-*.exe
          fail_on_unmatched_files: true