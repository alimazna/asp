<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0A1823">
<title>AYZR — منصة ذكاء سوق الذهب</title>
<link rel="stylesheet" href="assets/design-system.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="mark">A</div>
    <div>
      <div class="name">AYZR</div>
      <div class="tag">ذكاء سوق الذهب</div>
    </div>
  </div>

  <nav class="nav-group">
    <div class="label">المراقبة</div>
    <button class="nav-item" data-tab="overview"><span class="ico">◆</span> النظرة العامة</button>
    <button class="nav-item" data-tab="analysis"><span class="ico">▲</span> التحليل</button>
    <button class="nav-item" data-tab="news"><span class="ico">■</span> الأخبار</button>
    <button class="nav-item" data-tab="history"><span class="ico">◷</span> السجل</button>
  </nav>

  <nav class="nav-group">
    <div class="label">النظام</div>
    <button class="nav-item" data-tab="ecosystem"><span class="ico">⬡</span> المنظومة</button>
    <button class="nav-item" data-tab="system"><span class="ico">⚙</span> حالة النظام</button>
  </nav>

  <div class="nav-group" style="margin-top:auto">
    <div class="banner info" style="margin:0;font-size:11.5px">وضع الظل فقط<br>لا تنفيذ لعمليات تداول</div>
  </div>
</aside>

<header class="topbar">
  <button class="menu-toggle" id="menu-toggle" aria-label="القائمة"
    style="background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;cursor:pointer">☰</button>
  <div>
    <h1>منصة ذكاء سوق الذهب</h1>
    <div class="sub">XAUUSD · تحليل آلي · ظل فقط</div>
  </div>
  <div class="spacer"></div>
  <div id="conn-status" style="font-size:13px;color:var(--text-mid)"><span class="dot"></span> جارٍ الاتصال…</div>
</header>

<main id="main"></main>

<script src="assets/app.js"></script>
</body>
</html>
