<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AYZR — مركز مراقبة النظام</title>
<style>
  :root{
    --navy-deep:#070B18; --navy:#0C1428; --navy-raised:#131E3A;
    --border:#22304F; --gold:#D4AF37; --gold-soft:#E6C766;
    --text:#EDF0F7; --muted:#97A0B5; --up:#3FA97A; --down:#C25B5B;
    --warn:#D99A3D; --info:#5B8DC2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--navy-deep); color:var(--text);
    font-family:"Segoe UI",Tahoma,system-ui,sans-serif;
    line-height:1.6; padding-bottom:60px;
  }
  header{
    background:linear-gradient(180deg,var(--navy-raised),var(--navy));
    border-bottom:1px solid var(--border); padding:18px 24px;
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .logo{
    width:38px;height:38px;border-radius:10px;
    background:linear-gradient(135deg,var(--gold),var(--gold-soft));
    display:grid;place-items:center;font-weight:900;color:var(--navy-deep);
    font-size:17px;
  }
  h1{font-size:19px;font-weight:800}
  h1 span{color:var(--muted);font-size:12px;font-weight:400;display:block}
  .spacer{flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.ok{background:var(--up);box-shadow:0 0 8px var(--up)}
  .dot.bad{background:var(--down);box-shadow:0 0 8px var(--down)}
  .dot.warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  #status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:7px}
  nav{display:flex;gap:6px;padding:12px 24px;flex-wrap:wrap;
      border-bottom:1px solid var(--border);background:var(--navy)}
  nav button{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:8px 16px;border-radius:10px;cursor:pointer;font-size:14px;
    font-family:inherit;font-weight:600;transition:.15s;
  }
  nav button:hover{color:var(--text);border-color:var(--gold)}
  nav button.active{background:var(--gold);color:var(--navy-deep);border-color:var(--gold)}
  main{padding:22px 24px;max-width:1280px;margin:0 auto}
  .grid{display:grid;gap:16px}
  .cols-2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .cols-3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .cols-4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{
    background:var(--navy);border:1px solid var(--border);border-radius:16px;
    padding:18px;
  }
  .card h2{
    font-size:15px;font-weight:700;margin-bottom:14px;
    display:flex;align-items:center;gap:9px;color:var(--gold-soft);
  }
  .card h2::before{
    content:"";width:4px;height:16px;background:var(--gold);border-radius:2px;
  }
  .stat{font-size:27px;font-weight:800;letter-spacing:-.5px}
  .stat.up{color:var(--up)} .stat.down{color:var(--down)}
  .stat.gold{color:var(--gold)}
  .stat-label{font-size:12px;color:var(--muted);margin-top:3px}
  .row{display:flex;justify-content:space-between;align-items:center;
       padding:9px 0;border-bottom:1px solid rgba(34,48,79,.5);font-size:14px}
  .row:last-child{border-bottom:none}
  .row .k{color:var(--muted)} .row .v{font-weight:600}
  .pill{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;
        font-weight:700;border:1px solid}
  .pill.up{color:var(--up);border-color:rgba(63,169,122,.5);background:rgba(63,169,122,.12)}
  .pill.down{color:var(--down);border-color:rgba(194,91,91,.5);background:rgba(194,91,91,.12)}
  .pill.warn{color:var(--warn);border-color:rgba(217,154,61,.5);background:rgba(217,154,61,.12)}
  .pill.muted{color:var(--muted);border-color:var(--border);background:rgba(151,160,181,.08)}
  .pill.gold{color:var(--gold);border-color:rgba(212,175,55,.5);background:rgba(212,175,55,.12)}
  .empty{padding:34px;text-align:center;color:var(--muted);font-size:14px}
  .empty .big{font-size:34px;margin-bottom:10px;opacity:.5}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:right;color:var(--muted);font-weight:600;font-size:12px;
     padding:8px 10px;border-bottom:1px solid var(--border)}
  td{padding:10px;border-bottom:1px solid rgba(34,48,79,.4)}
  tr:last-child td{border-bottom:none}
  .banner{border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13.5px;
          border:1px solid;display:flex;gap:10px;align-items:flex-start}
  .banner.warn{background:rgba(217,154,61,.1);border-color:rgba(217,154,61,.4);color:var(--gold-soft)}
  .banner.bad{background:rgba(194,91,91,.1);border-color:rgba(194,91,91,.4);color:#E0A0A0}
  .banner.info{background:rgba(91,141,194,.1);border-color:rgba(91,141,194,.4);color:#A8C4E0}
  .mono{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12.5px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:26px;
         border-top:1px solid var(--border);margin-top:26px}
  .loading{color:var(--muted);text-align:center;padding:40px}
  a{color:var(--info)}
  .badge-shadow{
    font-size:11px;padding:4px 10px;border-radius:8px;
    background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.4);
    color:var(--gold-soft);font-weight:700;
  }
</style>
</head>
<body>
<header>
  <div class="logo">ع</div>
  <h1>AYZR — مركز مراقبة النظام
    <span>نظام ذكاء سوق الذهب XAUUSD · قراءة فقط · لا تنفيذ صفقات</span>
  </h1>
  <div class="spacer"></div>
  <span class="badge-shadow">وضع الظل SHADOW ONLY</span>
  <div id="status"><span class="dot"></span>جارٍ الاتصال…</div>
</header>

<nav id="nav">
  <button data-tab="overview" class="active">نظرة عامة</button>
  <button data-tab="analysis">التحليل</button>
  <button data-tab="engines">المحركات</button>
  <button data-tab="trades">الصفقات</button>
  <button data-tab="ecosystem">المنظومة</button>
  <button data-tab="news">الأخبار</button>
  <button data-tab="activity">السجل</button>
  <button data-tab="system">النظام</button>
</nav>

<main id="main"><div class="loading">جارٍ التحميل…</div></main>

<footer>
  AYZR · مركز مراقبة مستقل · يقرأ من واجهات الباكند الموثّقة فقط<br>
  لا توجد بيانات وهمية — كل قيمة معروضة مصدرها الخادم.
</footer>

<script>
// --- configuration --------------------------------------------------------
// This page talks ONLY to its own origin. The same-origin proxy (serve.py)
// holds the read-only client token in its environment and adds the
// Authorization header upstream, so this page never sees a token, never reads
// one from the URL, and never stores one. There is deliberately no ?token=,
// ?base=, localStorage or sessionStorage path: a credential in a URL leaks via
// history, referrer and logs, and one in browser storage leaks to any script.
const API_ORIGIN = window.location.origin;

let CURRENT = 'overview';
const CACHE = {};

async function api(path){
  // Relative to this origin only; the proxy owns the credential.
  const url = API_ORIGIN.replace(/\/$/,'') + path;
  const r = await fetch(url, {headers: {'Accept': 'application/json'}});
  const text = await r.text();
  let json = null;
  try { json = JSON.parse(text); } catch(e) {}
  return {ok:r.ok, status:r.status, json, text};
}

function setStatus(kind, text){
  const el = document.getElementById('status');
  el.innerHTML = `<span class="dot ${kind}"></span>${text}`;
}

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,
    c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- renderers -----------------------------------------------------------

async function renderOverview(){
  const m = document.getElementById('main');
  m.innerHTML = '<div class="loading">جارٍ قراءة حالة النظام…</div>';
  const [health, ready, engines, trades] = await Promise.all([
    api('/api/v1/health/v1'), api('/api/v1/readyz'),
    api('/api/v1/ayzr/engines'), api('/api/v1/ayzr/trades?state=all'),
  ]);
  CACHE.engines = engines.json; CACHE.trades = trades.json;

  // The backend nests its payload under `data`; read it defensively so a
  // schema change degrades to "unavailable" instead of showing a wrong value.
  const h = (health.json && (health.json.data || health.json)) || {};
  const rz = (ready.json && (ready.json.data || ready.json)) || {};
  const eng = (engines.json && engines.json.engines) || [];
  const tr = (trades.json && trades.json.trades) || [];
  const open = tr.filter(t=>t.is_open).length;

  let html = '';
  if (!health.ok){
    html += `<div class="banner bad">⚠ تعذّر الوصول إلى الخادم (HTTP ${health.status}).
      تحقق من عنوان الباكند ورمز العميل.</div>`;
  } else {
    html += `<div class="banner info">✔ الخادم متاح — البيانات معروضة كما أعادها الخادم.</div>`;
  }

  html += '<div class="grid cols-4">';
  const isReady = rz.ready===true;
  html += statCard(isReady?'جاهز':'غير جاهز', 'حالة النظام', isReady?'up':'warn');
  html += statCard(rz.mode||h.status||'—', 'الوضع', 'gold');
  html += statCard(h.bridge==='online'?'متصل':'غير متصل', 'جسر MT5',
                   h.bridge==='online'?'up':'warn');
  html += statCard(String(eng.length), 'المحركات', 'gold');
  html += statCard(String(open)+' / '+String(tr.length), 'صفقات نشطة / الكل', 'gold');
  html += '</div>';

  html += '<div class="grid cols-2" style="margin-top:16px">';
  html += '<div class="card"><h2>حالة المحركات</h2>';
  if (!eng.length) html += emptyBox('لا توجد محركات');
  else {
    html += '<table><tr><th>المحرك</th><th>الدخول</th><th>الحالة</th><th>الإشارات</th></tr>';
    for (const e of eng){
      html += `<tr><td>${esc(e.label_ar)}</td><td class="mono">${esc(e.entry_timeframe)}</td>
        <td><span class="pill ${e.busy?'warn':'up'}">${e.busy?'مشغول':'متاح'}</span></td>
        <td>${esc(e.published_count)}</td></tr>`;
    }
    html += '</table>';
  }
  html += '</div>';

  html += '<div class="card"><h2>ملخص الصفقات</h2>';
  if (!tr.length) html += emptyBox('لم تُصدر أي صفقة بعد');
  else {
    html += '<table><tr><th>المصدر</th><th>الاتجاه</th><th>الحالة</th><th>الأهداف</th></tr>';
    for (const t of tr.slice(0,8)){
      const hit = (t.targets||[]).filter(x=>x.reached).length;
      const tot = (t.targets||[]).length;
      html += `<tr><td>${esc(t.source_label_ar)}</td>
        <td><span class="pill ${t.direction==='BUY'?'up':'down'}">${esc(t.direction_label_ar)}</span></td>
        <td>${esc(t.status_label_ar)}</td>
        <td class="mono">${hit}/${tot}</td></tr>`;
    }
    html += '</table>';
  }
  html += '</div></div>';
  m.innerHTML = html;
  setStatus(health.ok?'ok':'bad', health.ok?'متصل':'غير متصل');
}

function statCard(value, label, tone){
  return `<div class="card"><div class="stat ${tone||''}">${esc(value)}</div>
    <div class="stat-label">${esc(label)}</div></div>`;
}
function emptyBox(msg){
  return `<div class="empty"><div class="big">◍</div>${esc(msg)}</div>`;
}

async function renderEngines(){
  const m = document.getElementById('main');
  m.innerHTML = '<div class="loading">جارٍ تحميل المحركات…</div>';
  const r = await api('/api/v1/ayzr/engines');
  const eng = (r.json && r.json.engines) || [];
  if (!eng.length){ m.innerHTML = emptyBox('لم يُرجع الخادم أي محرك'); return; }
  let html = '<div class="grid cols-3">';
  for (const e of eng){
    html += `<div class="card">
      <h2>${esc(e.label_ar)} ${e.busy?'<span class="pill warn">مشغول</span>':''}</h2>
      <div class="row"><span class="k">إطار الدخول</span><span class="v mono">${esc(e.entry_timeframe)}</span></div>
      <div class="row"><span class="k">أطر السياق</span><span class="v mono">${esc((e.context_timeframes||[]).join(' · ')||'—')}</span></div>
      <div class="row"><span class="k">وقف الخسارة</span><span class="v">${esc(e.stop_atr)} × ATR</span></div>
      <div class="row"><span class="k">الهدف</span><span class="v">${esc(e.target_atr)} × ATR</span></div>
      <div class="row"><span class="k">نطاق RSI</span><span class="v mono">${esc(e.rsi_short)} – ${esc(e.rsi_long)}</span></div>
      <div class="row"><span class="k">حد القوة</span><span class="v mono">${esc(e.min_strength)}</span></div>
      <div class="row"><span class="k">توافق السياق</span><span class="v">${e.require_context_alignment?'مطلوب':'غير مطلوب'}</span></div>
      <div class="row"><span class="k">يسمح بالتذبذب</span><span class="v">${e.allow_ranging?'نعم':'لا'}</span></div>
      <div class="row"><span class="k">الإشارات الصادرة</span><span class="v">${esc(e.published_count)}</span></div>
    </div>`;
  }
  html += '</div>';
  m.innerHTML = html;
  setStatus('ok','متصل');
}

async function renderTrades(){
  const m = document.getElementById('main');
  m.innerHTML = '<div class="loading">جارٍ تحميل الصفقات…</div>';
  const r = await api('/api/v1/ayzr/trades?state=all');
  const tr = (r.json && r.json.trades) || [];
  if (!tr.length){ m.innerHTML = emptyBox('لم تُصدر أي صفقة بعد'); return; }
  let html = `<div class="banner info">إجمالي ${tr.length} صفقة — تُعرض من سجل الخادم فقط.</div>`;
  html += '<div class="card"><table><tr><th>المعرّف</th><th>المصدر</th><th>الاتجاه</th>'+
          '<th>الدخول</th><th>الوقف</th><th>الحالة</th><th>النتيجة</th><th>الأهداف</th></tr>';
  for (const t of tr){
    const hit = (t.targets||[]).filter(x=>x.reached).length;
    const tot = (t.targets||[]).length;
    html += `<tr>
      <td class="mono">${esc(t.id)}</td>
      <td>${esc(t.source_label_ar)}</td>
      <td><span class="pill ${t.direction==='BUY'?'up':'down'}">${esc(t.direction_label_ar)}</span></td>
      <td class="mono">${esc(t.entry)}</td>
      <td class="mono">${esc(t.stop)}</td>
      <td>${esc(t.status_label_ar)}</td>
      <td>${esc(t.outcome_label_ar)}</td>
      <td class="mono">${hit}/${tot}</td>
    </tr>`;
  }
  html += '</table></div>';
  m.innerHTML = html;
  setStatus('ok','متصل');
}

async function renderNews(){
  const m = document.getElementById('main');
  m.innerHTML = '<div class="loading">جارٍ تحميل الأخبار…</div>';
  const r = await api('/api/v1/news?limit=40');
  const items = Array.isArray(r.json) ? r.json : (r.json && (r.json.news||r.json.items)) || [];
  if (!items.length){ m.innerHTML = emptyBox('لا توجد أخبار'); return; }
  let html = '<div class="grid cols-2">';
  for (const n of items.slice(0,30)){
    html += `<div class="card">
      <h2>${esc(n.title||n.headline||'بدون عنوان')}</h2>
      <div class="row"><span class="k">المصدر</span><span class="v">${esc(n.source||'—')}</span></div>
      <div class="row"><span class="k">وقت النشر</span><span class="v mono">${esc(n.published_at||n.publishedAt||'—')}</span></div>
      ${n.summary_ar?`<p style="margin-top:10px;color:var(--muted);font-size:13.5px">${esc(n.summary_ar)}</p>`:''}
    </div>`;
  }
  html += '</div>';
  m.innerHTML = html;
  setStatus('ok','متصل');
}

async function renderActivity(){
  const m = document.getElementById('main');
  m.innerHTML = '<div class="loading">جارٍ تحميل السجل…</div>';
  const r = await api('/api/v1/activity?limit=80');
  const items = (r.json && (r.json.entries||r.json.activity||r.json.items)) || [];
  if (!items.length){ m.innerHTML = emptyBox('السجل فارغ'); return; }
  let html = '<div class="card"><table><tr><th>الوقت</th><th>النوع</th><th>النتيجة</th>'+
             '<th>المصدر</th><th>التفصيل</th></tr>';
  for (const a of items){
    const cls = a.outcome==='ok'?'up':(a.outcome==='error'?'down':'warn');
    html += `<tr><td class="mono">${esc(a.at||'—')}</td><td>${esc(a.kind||'')}</td>
      <td><span class="pill ${cls}">${esc(a.outcome||'')}</span></td>
      <td>${esc(a.source||'')}</td><td>${esc(a.detail||a.reason||'')}</td></tr>`;
  }
  html += '</table></div>';
  m.innerHTML = html;
  setStatus('ok','متصل');
}

// ---- ecosystem -----------------------------------------------------------
// Four ecosystem routes, fetched together. Each payload is read defensively
// from the `data` envelope; a route that fails degrades to an inline note
// rather than blanking the whole tab. No value is fabricated: a null stays
// "—", and an uncalibrated confidence is never shown as a probability.
async function renderEcosystem(){
  const m = document.getElementById('main');
  m.innerHTML = '<div class="loading">جارٍ تحميل المنظومة…</div>';

  const [sessR, engR, oppR, ledR] = await Promise.all([
    api('/api/v1/ayzr/ecosystem/sessions'),
    api('/api/v1/ayzr/ecosystem/engines'),
    api('/api/v1/ayzr/ecosystem/opportunities'),
    api('/api/v1/ayzr/ecosystem/ledger?limit=100'),
  ]);
  const unwrap = (r) => (r.json && (r.json.data || r.json)) || {};
  const sess = unwrap(sessR), eng = unwrap(engR);
  const opp = unwrap(oppR), led = unwrap(ledR);

  let html = '<div class="banner info">وضع الظل فقط — لا تنفيذ لعمليات تداول. '+
             'كل قيمة معروضة مصدرها الخادم.</div>';

  // Sessions
  html += '<div class="card"><h2>الجلسات</h2>';
  const sessions = sess.sessions || [];
  if (!sessions.length){
    html += '<div class="row"><span class="k">لا تتوفر بيانات الجلسات</span></div>';
  } else {
    if (sess.londonNewYorkOverlap)
      html += '<div class="row"><span class="k">تداخل لندن ونيويورك</span>'+
              '<span class="v"><span class="pill up">نشط</span></span></div>';
    for (const s of sessions){
      const cls = s.error ? 'warn' : (s.phase==='OPEN' ? 'up' : '');
      html += `<div class="row"><span class="k">${esc(s.nameAr||s.id)} `+
              `<span class="mono">${esc(s.zoneId)}</span></span>`+
              `<span class="v"><span class="pill ${cls}">${esc(s.phaseAr)}</span> `+
              `${s.localTime?('<span class="mono">'+esc(s.localTime)+'</span>'):'—'}`+
              `${s.inDst?' <span class="pill warn">توقيت صيفي</span>':''}</span></div>`;
      if (s.error)
        html += `<div class="row"><span class="k">خطأ المنطقة الزمنية</span>`+
                `<span class="v">${esc(s.error)}</span></div>`;
    }
  }
  html += '</div>';

  // Engines
  html += '<div class="card"><h2>المحركات المتخصصة</h2>'+
          `<div class="row"><span class="k">إصدار العقد</span>`+
          `<span class="v mono">${esc(eng.contractSchemaVersion)}</span></div>`;
  const engines = eng.engines || [];
  if (!engines.length){
    html += '<div class="row"><span class="k">لا توجد محرّكات مسجّلة</span></div>';
  } else {
    for (const e of engines){
      const cls = e.health==='HEALTHY'?'up':(e.health==='UNAVAILABLE'?'warn':'');
      html += `<div class="row"><span class="k">${esc(e.strategyFamilyAr)} `+
              `<span class="mono">${esc(e.engineId)}</span></span>`+
              `<span class="v"><span class="pill ${cls}">${esc(e.healthAr)}</span></span></div>`;
      if (e.noteAr)
        html += `<div class="row"><span class="k"></span><span class="v">${esc(e.noteAr)}</span></div>`;
    }
  }
  html += '</div>';

  // Opportunities
  html += '<div class="card"><h2>الفرص</h2>';
  const opps = opp.opportunities || [];
  if ((opp.dataQualityWarnings||[]).length){
    html += '<div class="banner warn">تحذيرات جودة البيانات: '+
            opp.dataQualityWarnings.map(esc).join(' · ')+'</div>';
  }
  if ((opp.engineFailures||[]).length){
    html += '<div class="banner warn">أعطال المحرّكات: '+
            opp.engineFailures.map(esc).join(' · ')+'</div>';
  }
  if (!opps.length){
    html += '<div class="row"><span class="k">لا توجد فرص موثوقة حالياً — '+
            'لا يتم اختلاق فرص عند غياب البيانات.</span></div>';
  } else {
    for (const o of opps){
      const cls = o.state==='PUBLISH'?'up':(o.state==='WATCH'?'warn':'');
      html += `<div class="row"><span class="k">${esc(o.symbol)} · `+
              `${esc(o.timeframe)} · ${esc(o.directionAr)}</span>`+
              `<span class="v"><span class="pill ${cls}">${esc(o.stateAr)}</span></span></div>`;
      html += `<div class="row"><span class="k">التبرير</span>`+
              `<span class="v">${esc(o.rationaleAr)}</span></div>`;
      if (o.entry)
        html += `<div class="row"><span class="k">الدخول</span>`+
                `<span class="v mono">${esc(o.entry.price)} (${esc(o.entry.source)})</span></div>`;
      if (o.stopLoss)
        html += `<div class="row"><span class="k">وقف الخسارة</span>`+
                `<span class="v mono">${esc(o.stopLoss.price)}</span></div>`;
      for (let i=0;i<(o.takeProfits||[]).length;i++)
        html += `<div class="row"><span class="k">هدف ${i+1}</span>`+
                `<span class="v mono">${esc(o.takeProfits[i].price)}</span></div>`;
      if ((o.agreeingEngines||[]).length)
        html += `<div class="row"><span class="k">محرّكات متوافقة</span>`+
                `<span class="v">${o.agreeingEngines.map(esc).join(' · ')}</span></div>`;
      if ((o.disagreeingEngines||[]).length)
        html += `<div class="row"><span class="k">محرّكات معارضة</span>`+
                `<span class="v">${o.disagreeingEngines.map(esc).join(' · ')}</span></div>`;
      if ((o.conflictNotesAr||[]).length)
        html += `<div class="row"><span class="k">تعارضات</span>`+
                `<span class="v">${o.conflictNotesAr.map(esc).join(' · ')}</span></div>`;
      html += `<div class="row"><span class="k">نواة ASTRA</span><span class="v">`+
              `${o.astraCorePresent?'مساهمة موجودة':'لا مساهمة'}</span></div>`;
      for (const ev of (o.contributingEvents||[])){
        const prob = (ev.confidence && ev.confidence.calibrated &&
                      ev.confidence.probability!=null)
          ? (ev.confidence.probability*100).toFixed(1)+'%'
          : 'غير معاير — لا يُعرض كاحتمال';
        html += `<div class="row"><span class="k">&nbsp;&nbsp;${esc(ev.strategyFamilyAr)} · `+
                `${esc(ev.directionAr)}</span><span class="v">${esc(ev.explanationAr)} — `+
                `${esc(prob)}</span></div>`;
      }
    }
  }
  html += '</div>';

  // Ledger
  html += '<div class="card"><h2>سجل القرارات</h2>'+
          `<div class="row"><span class="k">عدد الصفوف</span>`+
          `<span class="v mono">${esc(led.count)}</span></div>`;
  const entries = led.entries || [];
  if (!entries.length){
    html += '<div class="row"><span class="k">لا توجد قرارات مسجّلة بعد</span></div>';
  } else {
    html += '<table><tr><th>#</th><th>النوع</th><th>المحرّك</th>'+
            '<th>السبب</th><th>التفصيل</th></tr>';
    for (const en of entries){
      html += `<tr><td class="mono">${esc(en.seq)}</td><td>${esc(en.typeAr||en.type)}</td>`+
              `<td class="mono">${esc(en.engineId||'—')}</td>`+
              `<td class="mono">${esc(en.reasonCode)}</td><td>${esc(en.detailAr)}</td></tr>`;
    }
    html += '</table>';
  }
  html += '</div>';

  m.innerHTML = html;
  setStatus('ok','متصل');
}

// ---- analysis ------------------------------------------------------------
// ASTRA analysis, context, signal, probability, risk, and the multi-timeframe
// matrix. Every field is read defensively from the `data` envelope; a null or
// unavailable state is shown as "—" or an explicit Arabic note, never as a
// fabricated number. An uncalibrated probability is never shown as a percent.
async function renderAnalysis(){
  const m = document.getElementById('main');
  m.innerHTML = '<div class="loading">جارٍ تحميل التحليل…</div>';

  const [aR, cR, sR, pR, rR, tfR] = await Promise.all([
    api('/api/v1/analysis/latest'), api('/api/v1/context/latest'),
    api('/api/v1/signals/latest'), api('/api/v1/probability/latest'),
    api('/api/v1/risk/latest'), api('/api/v1/timeframes'),
  ]);
  const U = (r)=> (r.json && (r.json.data || r.json)) || {};
  const a = U(aR), c = U(cR), s = U(sR), p = U(pR), rk = U(rR), tf = U(tfR);

  let html = '<div class="banner info">تحليل ASTRA الأصلي — للقراءة فقط. '+
             'لا تُعدّل هذه الطبقة قرارات محرّك ASTRA ولا تنفّذ صفقات.</div>';

  // Signal summary
  const sig = a.signal || {};
  const dirTone = sig.direction==='BULLISH'?'up':(sig.direction==='BEARISH'?'down':'');
  html += '<div class="grid cols-4">';
  html += statCard(a.timestamp ? a.timestamp.replace('T',' ').replace('Z','') : '—',
                   'وقت التحليل', 'gold');
  html += statCard(sig.direction||'NONE', 'الاتجاه', dirTone);
  html += statCard(sig.score==null?'—':String(sig.score), 'النتيجة (score)', 'gold');
  html += statCard(sig.probability_calibrated && sig.probability!=null
                     ? (sig.probability*100).toFixed(1)+'%' : 'غير معاير',
                   'الاحتمال', 'warn');
  html += '</div>';

  // Context
  const ctx = a.context || c.context || {};
  html += '<div class="card"><h2>سياق السوق</h2>';
  html += `<div class="row"><span class="k">النظام (regime)</span><span class="v mono">${esc(ctx.regime||'UNKNOWN')}</span></div>`;
  html += `<div class="row"><span class="k">ميل H4</span><span class="v mono">${esc(ctx.h4_bias||'UNKNOWN')}</span></div>`;
  html += `<div class="row"><span class="k">محفّز M15</span><span class="v mono">${esc(ctx.m15_trigger||'NONE')}</span></div>`;
  html += `<div class="row"><span class="k">توافق الأطر</span><span class="v mono">${ctx.mtf_agreement==null?'—':esc(ctx.mtf_agreement)}</span></div>`;
  html += `<div class="row"><span class="k">حالة التذبذب</span><span class="v mono">${esc(ctx.volatility_state||'UNKNOWN')}</span></div>`;
  html += '</div>';

  // Decision gate
  const dec = a.decision || {};
  html += '<div class="card"><h2>بوابة القرار</h2>';
  html += `<div class="row"><span class="k">متاح</span><span class="v"><span class="pill ${dec.available?'up':'warn'}">${dec.available?'نعم':'لا'}</span></span></div>`;
  html += `<div class="row"><span class="k">أطر متعددة متاحة</span><span class="v"><span class="pill ${dec.mtf_available?'up':'warn'}">${dec.mtf_available?'نعم':'لا'}</span></span></div>`;
  html += `<div class="row"><span class="k">بوابة النواة متعددة الأطر</span><span class="v"><span class="pill ${dec.mtf_core_gate_passed?'up':'warn'}">${dec.mtf_core_gate_passed?'عابرة':'غير عابرة'}</span></span></div>`;
  html += `<div class="row"><span class="k">سلطة H4 البنيوية</span><span class="v mono">${dec.h4_structural_authority==null?'—':esc(dec.h4_structural_authority)}</span></div>`;
  html += `<div class="row"><span class="k">توافق H4/M15</span><span class="v mono">${dec.h4_m15_agreement==null?'—':esc(dec.h4_m15_agreement)}</span></div>`;
  html += `<div class="row"><span class="k">توافق H4/D1</span><span class="v mono">${dec.h4_d1_agreement==null?'—':esc(dec.h4_d1_agreement)}</span></div>`;
  for (const br of (dec.block_reasons||[]))
    html += `<div class="row"><span class="k">سبب الحجب</span><span class="v">${esc(br)}</span></div>`;
  html += '</div>';

  // Signal record
  html += '<div class="card"><h2>آخر إشارة</h2>';
  if (!s.available && !s.direction){
    html += `<div class="row"><span class="k">${esc(s.reason||'لا توجد إشارات مسجّلة بعد')}</span></div>`;
  } else {
    html += `<div class="row"><span class="k">الاتجاه</span><span class="v mono">${esc(s.direction||'—')}</span></div>`;
    html += `<div class="row"><span class="k">الأفق</span><span class="v mono">${esc(s.horizon||'—')}</span></div>`;
  }
  html += '</div>';

  // Probability record
  html += '<div class="card"><h2>الاحتمال</h2>';
  if (!p.available){
    html += `<div class="row"><span class="k">${esc(p.reason||'لا توجد تنبؤات مسجّلة بعد')}</span></div>`;
    html += '<div class="row"><span class="k">ملاحظة</span><span class="v">الاحتمال يُعرض فقط عند معايرته صراحةً — لا يتم اختلاق نسب.</span></div>';
  } else {
    html += `<div class="row"><span class="k">معاير</span><span class="v">${p.calibrated?'نعم':'لا'}</span></div>`;
    html += `<div class="row"><span class="k">القيمة</span><span class="v mono">${p.calibrated&&p.probability!=null?(p.probability*100).toFixed(1)+'%':'غير معاير — لا يُعرض كاحتمال'}</span></div>`;
  }
  html += '</div>';

  // Risk
  html += '<div class="card"><h2>المخاطر</h2>';
  if (!rk.available){
    html += `<div class="row"><span class="k">${esc(rk.reason||'لا تتوفر بيانات مخاطر')}</span></div>`;
  } else {
    html += `<div class="row"><span class="k">مراكز مفتوحة</span><span class="v mono">${esc(rk.open_positions)}</span></div>`;
    html += `<div class="row"><span class="k">إجمالي المخاطرة المفتوحة</span><span class="v mono">${esc(rk.aggregate_open_risk_fraction)}</span></div>`;
    html += `<div class="row"><span class="k">محدودة بحاجز الأمان</span><span class="v"><span class="pill ${rk.risk_bounded_by_guardian?'up':'warn'}">${rk.risk_bounded_by_guardian?'نعم':'لا'}</span></span></div>`;
    html += `<div class="row"><span class="k">اقتراح متاح</span><span class="v">${rk.proposal_available?'نعم':'لا'}</span></div>`;
    if (rk.proposal_reason)
      html += `<div class="row"><span class="k">سبب عدم الاقتراح</span><span class="v">${esc(rk.proposal_reason)}</span></div>`;
  }
  html += '</div>';

  // Timeframe matrix. `data` is a bare array here, not an object.
  const frames = Array.isArray(tf) ? tf : (tf.timeframes || []);
  html += '<div class="card"><h2>مصفوفة الأطر الزمنية</h2>';
  if (!frames.length){
    html += '<div class="row"><span class="k">لا تتوفر بيانات الأطر الزمنية</span></div>';
  } else {
    html += '<table><tr><th>الإطار</th><th>مشاهد</th><th>شمعدان مغلق</th>'+
            '<th>الجودة</th><th>آخر تحديث ناجح</th></tr>';
    for (const f of frames){
      const q = f.quality || {};
      const tone = f.decision_grade ? 'up' : (f.observed ? 'warn' : '');
      html += `<tr><td class="mono">${esc(f.timeframe||'—')}</td>`+
              `<td><span class="pill ${f.observed?'up':'warn'}">${f.observed?'نعم':'لا'}</span></td>`+
              `<td>${f.has_closed_bar?'نعم':'لا'}</td>`+
              `<td><span class="pill ${tone}">${esc(q.state||'UNKNOWN')}</span></td>`+
              `<td class="mono">${esc(f.last_successful_update||'—')}</td></tr>`;
    }
    html += '</table>';
  }
  html += '</div>';

  m.innerHTML = html;
  setStatus('ok','متصل');
}

// ---- system --------------------------------------------------------------
// Runtime posture, bridge, shadow book, governance, research, and audit.
// These are the safety-critical read-outs: shadow_only, live-trading
// authorisation, and bridge state. Nothing here can execute a trade.
async function renderSystem(){
  const m = document.getElementById('main');
  m.innerHTML = '<div class="loading">جارٍ تحميل حالة النظام…</div>';

  const [stR, brR, spR, soR, goR, reR, auR, prR] = await Promise.all([
    api('/api/v1/system/state'), api('/api/v1/bridge/status'),
    api('/api/v1/shadow/positions'), api('/api/v1/shadow/outcomes'),
    api('/api/v1/governance/status'), api('/api/v1/research/status'),
    api('/api/v1/audit/recent'), api('/api/v1/providers'),
  ]);
  const U = (r)=> (r.json && (r.json.data || r.json)) || {};
  const st = U(stR), br = U(brR), go = U(goR), re = U(reR), au = U(auR);
  const sp = (spR.json && (spR.json.data || spR.json)) || [];
  const so = (soR.json && (soR.json.data || soR.json)) || [];
  const pr = U(prR);

  let html = '<div class="banner info">وضع الظل فقط — لا تنفيذ. '+
             'هذه قراءات السلامة والجاهزية كما أعادها الخادم.</div>';

  // Safety posture first
  html += '<div class="grid cols-4">';
  html += statCard(st.shadow_only?'مفعّل':'—', 'وضع الظل', st.shadow_only?'up':'warn');
  html += statCard(go.live_trading_authorised?'مصرّح':'غير مصرّح',
                   'تداول حي', go.live_trading_authorised?'down':'up');
  html += statCard(st.mode||'—', 'الوضع', 'gold');
  html += statCard(st.ready?'جاهز':'غير جاهز', 'الجاهزية', st.ready?'up':'warn');
  html += '</div>';

  // Bridge
  html += '<div class="card"><h2>جسر MT5</h2>';
  html += `<div class="row"><span class="k">حالة الجسر</span><span class="v"><span class="pill ${br.bridge_process_state==='ONLINE'?'up':'warn'}">${esc(br.bridge_process_state||'—')}</span></span></div>`;
  html += `<div class="row"><span class="k">مرحلة الإقلاع</span><span class="v mono">${esc(br.startup_stage||'—')}</span></div>`;
  html += `<div class="row"><span class="k">المصافحة</span><span class="v">${br.handshake_ok?'ناجحة':'لم تتم'}</span></div>`;
  html += `<div class="row"><span class="k">MT5 جاهز</span><span class="v">${br.mt5_ready?'نعم':'لا'}</span></div>`;
  html += `<div class="row"><span class="k">النقل</span><span class="v mono">${esc(br.transport||'—')}</span></div>`;
  html += `<div class="row"><span class="k">محلي فقط</span><span class="v">${br.loopback_only?'نعم':'لا'}</span></div>`;
  html += `<div class="row"><span class="k">الحزمة متوفرة</span><span class="v">${br.package_available?'نعم':'لا'}</span></div>`;
  if (br.broker) html += `<div class="row"><span class="k">الوسيط</span><span class="v">${esc(br.broker)}</span></div>`;
  html += '</div>';

  // Governance
  html += '<div class="card"><h2>الحوكمة</h2>';
  html += `<div class="row"><span class="k">طلبات معلّقة</span><span class="v mono">${esc(go.pending_count==null?'—':go.pending_count)}</span></div>`;
  html += `<div class="row"><span class="k">تداول حي مصرّح</span><span class="v"><span class="pill ${go.live_trading_authorised?'down':'up'}">${go.live_trading_authorised?'مصرّح':'غير مصرّح'}</span></span></div>`;
  html += '</div>';

  // Research
  html += '<div class="card"><h2>البحث</h2>';
  html += `<div class="row"><span class="k">متاح</span><span class="v">${re.available?'نعم':'لا'}</span></div>`;
  html += `<div class="row"><span class="k">الوضع</span><span class="v mono">${esc(re.mode||'—')}</span></div>`;
  html += `<div class="row"><span class="k">تجارب</span><span class="v mono">${esc(re.experiment_count==null?'—':re.experiment_count)}</span></div>`;
  if (re.note) html += `<div class="row"><span class="k">ملاحظة</span><span class="v">${esc(re.note)}</span></div>`;
  html += '</div>';

  // Shadow book
  html += '<div class="card"><h2>دفتر الظل</h2>';
  html += `<div class="row"><span class="k">مراكز ظل</span><span class="v mono">${Array.isArray(sp)?sp.length:'—'}</span></div>`;
  html += `<div class="row"><span class="k">نتائج ظل</span><span class="v mono">${Array.isArray(so)?so.length:'—'}</span></div>`;
  html += '</div>';

  // Audit
  html += '<div class="card"><h2>التدقيق</h2>';
  html += `<div class="row"><span class="k">عدد السجلات</span><span class="v mono">${esc(au.count==null?'—':au.count)}</span></div>`;
  html += `<div class="row"><span class="k">حجم تدفّق التدقيق</span><span class="v mono">${esc(au.audit_stream_size==null?'—':au.audit_stream_size)}</span></div>`;
  html += `<div class="row"><span class="k">حوادث نشطة</span><span class="v mono">${Array.isArray(au.active_incidents)?au.active_incidents.length:'—'}</span></div>`;
  html += '</div>';

  // Providers (secret-free)
  html += '<div class="card"><h2>مزوّدو الذكاء الاصطناعي</h2>';
  const provs = pr.providers || [];
  if (!provs.length){
    html += '<div class="row"><span class="k">لا توجد بيانات مزوّدين</span></div>';
  } else {
    html += '<table><tr><th>المزوّد</th><th>مهيّأ</th><th>نجاح</th><th>فشل</th></tr>';
    for (const pv of provs){
      html += `<tr><td class="mono">${esc(pv.name||pv.id||'—')}</td>`+
              `<td>${pv.configured?'نعم':'لا'}</td>`+
              `<td class="mono">${esc(pv.success_count==null?'—':pv.success_count)}</td>`+
              `<td class="mono">${esc(pv.failure_count==null?'—':pv.failure_count)}</td></tr>`;
    }
    html += '</table>';
  }
  html += '</div>';

  m.innerHTML = html;
  setStatus('ok','متصل');
}

// ---- router --------------------------------------------------------------

const RENDERERS = {
  overview: renderOverview, analysis: renderAnalysis, engines: renderEngines,
  trades: renderTrades, ecosystem: renderEcosystem,
  news: renderNews, activity: renderActivity, system: renderSystem,
};

function show(tab){
  CURRENT = tab;
  document.querySelectorAll('#nav button').forEach(b=>
    b.classList.toggle('active', b.dataset.tab===tab));
  RENDERERS[tab]();
}

document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button');
  if (b) show(b.dataset.tab);
});

show('overview');
setInterval(()=>{ if (CURRENT==='overview') renderOverview(); }, 30000);
</script>
</body>
</html>
