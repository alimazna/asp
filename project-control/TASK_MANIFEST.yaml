project:
  technical_id: AURA
  product_brand: ASTRA
  asset: XAUUSD
  primary_mode: SHADOW
  backend_agent: DeepSeek v4.1 Flash via OpenHands
  frontend_agent: Alpha after backend approval
  backend_first: true
  market_data_boundary: bundled Python + MetaTrader5 bridge
  bridge_process_model: separate supervised child process
  bridge_transport: loopback JSON API on 127.0.0.1
  startup: double-click; no CMD requirement
authority:
  active_master: docs/AURA_ASTRA_MASTER_UNIFIED_PROJECT_v4.0.md
  archived_master: docs/archive/XAUUSD_SOVEREIGN_MASTER_UNIFIED_PROJECT_v3.0.original.md
  archived_python_reference: docs/archive/Python_MetaTrader5_Reference.original.md
rules:
  one_task_one_prompt_one_source_file: true
  blocked_is_valid: true
  no_lookahead: true
  no_repaint: true
  unknown_is_not_neutral: true
  no_live_trading_initially: true
  no_mql5_candle_ingestion: true
  frontend_deferred_until_backend_review: true
backend_completion_gate: docs/architecture/BACKEND_DONE_DEFINITION.md
bootstrap_prompt: ai-prompts/TASK-BOOTSTRAP-BACKEND-000.md
