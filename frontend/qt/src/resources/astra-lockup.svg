<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120">
  <title>ASTRA Lockup — Symbol + Wordmark</title>
  <desc>ASTRA geometric symbol on left, ASTRA wordmark on right, vertically centered, total width ~3.5x symbol height</desc>

  <!-- === SYMBOL (reuse the A geometry) === -->
  <g transform="translate(5, 5)">
    <!-- LEFT LEG -->
    <polygon points="55,5 15,115 42,115" fill="#E8EEF5"/>
    <!-- RIGHT LEG -->
    <polygon points="55,5 95,115 68,115" fill="#B8C4D4"/>
    <!-- CROSSBAR -->
    <polygon points="30,62 80,62 80,70 30,70" fill="#5A6B80"/>
    <!-- FACET LINES -->
    <line x1="55" y1="5" x2="30" y2="65" stroke="#162A44" stroke-width="0.8" opacity="0.6"/>
    <line x1="55" y1="5" x2="80" y2="65" stroke="#162A44" stroke-width="0.8" opacity="0.6"/>
    <line x1="15" y1="115" x2="30" y2="65" stroke="#162A44" stroke-width="0.8" opacity="0.6"/>
    <line x1="95" y1="115" x2="80" y2="65" stroke="#162A44" stroke-width="0.8" opacity="0.6"/>
  </g>

  <!-- === WORDMARK "ASTRA" === -->
  <!-- All uppercase, wide letter spacing ~0.15em, geometric sans-serif, medium-semibold -->
  <!-- Height ~60% of symbol height (120 * 0.6 = ~72px), positioned right of symbol -->
  <!-- Gap ~12px at 32px size; scale proportionally: 120/32*12 = 45px gap -->
  <g transform="translate(115, 28)" font-family="Inter, Segoe UI, system-ui, sans-serif" font-weight="600" font-size="52" letter-spacing="7" fill="#E8EEF5">
    <text x="0" y="0" text-anchor="start">ASTRA</text>
  </g>
</svg>
