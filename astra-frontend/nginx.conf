# Static hosting for the ASTRA web bundle.
# The app uses HashRouter, so no rewrite is strictly required; the fallback
# below additionally supports non-hash entry URLs (e.g. /chart).
#
# This file is consumed as an nginx template (copied to
# /etc/nginx/templates/default.conf.template), so ${PORT} is substituted at
# container start — Docker Compose sets PORT=8080, Railway injects its own.
server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers that do not require knowing the gateway origin.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The shell must never be cached, or clients pin an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Pass-through for a same-origin gateway deployment. If VITE_API_BASE_URL is
    # an absolute URL this location is simply unused. Replace the upstream with
    # the real gateway host when it exists — do not point it at localhost.
    location /api/ {
        return 502;
        # proxy_pass https://<your-gateway-host>;
        # proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
